      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.2" />
